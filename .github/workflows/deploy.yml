name: deploy-tool-station

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages 同时只允许一次部署，避免竞态
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependency
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Run 7-step pipeline (regenerates tools_output)
        run: python main.py

      - name: Build dashboard
        run: python build_dashboard.py

      # _site 是最终部署到 Pages 的根目录
      # 这里把 tools_output 拍平到 _site 根，dashboard 放 /dashboard/ 子路径
      - name: Build deploy bundle
        run: |
          mkdir -p _site/dashboard
          cp -r tools_output/. _site/
          cp dashboard/index.html _site/dashboard/index.html
          # 新增 .nojekyll 让 GitHub Pages 不走 Jekyll 处理
          touch _site/.nojekyll
          echo "--- bundle contents ---"
          ls -la _site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        id: deployment
        environment:
          name: github-pages
          url: ${{ steps.deployment.outputs.page_url }}

      - name: Print live URL
        run: |
          echo "Site is live at: ${{ steps.deployment.outputs.page_url }}"
          echo "Tool home:       ${{ steps.deployment.outputs.page_url }}/"
          echo "Privacy:         ${{ steps.deployment.outputs.page_url }}/privacy.html"
          echo "Dashboard:       ${{ steps.deployment.outputs.page_url }}/dashboard/"
